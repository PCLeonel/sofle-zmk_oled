# =============================================================================
# CUSTOM OLED SCREEN
# =============================================================================

# Enable OLED display support.
CONFIG_ZMK_DISPLAY=y

# Enable Leonel's custom OLED screen module.
CONFIG_LEONEL_SOFLE_OLED=y

# Use the custom screen instead of the built-in ZMK screen.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Turn the OLED off when entering idle state.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Update the display through the system work queue.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y


# =============================================================================
# DISABLE STOCK ZMK WIDGETS
# =============================================================================

# The custom screen renders all information directly.
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n


# =============================================================================
# IMPORTANT: WPM
# =============================================================================

# Do not enable CONFIG_ZMK_WPM here.
#
# This shared file is applied to both halves of the Sofle.
# WPM must be enabled only on sofle_left in build.yaml because
# the right side is a split peripheral and does not process the
# keycode events required by the WPM subsystem.


# =============================================================================
# ROTARY ENCODERS
# =============================================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# =============================================================================
# POWER SAVING
# =============================================================================

# Enter idle state after 30 seconds.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep.
CONFIG_ZMK_SLEEP=y

# Enter deep sleep after 15 minutes.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# =============================================================================
# ZMK STUDIO
# =============================================================================

CONFIG_ZMK_STUDIO_LOCKING=n


# =============================================================================
# OPTIONAL BLUETOOTH TROUBLESHOOTING
# =============================================================================

# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

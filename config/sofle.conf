# =============================================================================
# CUSTOM OLED SCREEN
# =============================================================================

# Enable OLED display support.
CONFIG_ZMK_DISPLAY=y

# Enable Leonel's custom OLED screen module.
CONFIG_LEONEL_SOFLE_OLED=y

# Use the custom screen instead of ZMK's built-in status screen.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Turn the OLED off when the keyboard enters idle state.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Update the display through the system work queue.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y


# =============================================================================
# DISABLE STOCK ZMK WIDGETS
# =============================================================================

# The custom screen obtains and displays this information directly.
# Disabling the stock widgets prevents duplicate elements and saves memory.

CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n


# =============================================================================
# WPM CALCULATION
# =============================================================================

# Enable words-per-minute calculation.
#
# The stock WPM widget remains disabled. The custom OLED code reads the
# calculated value and displays it in its own position.
CONFIG_ZMK_WPM=y


# =============================================================================
# ROTARY ENCODERS
# =============================================================================

# Enable EC11 rotary encoder support.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# =============================================================================
# IDLE AND DEEP SLEEP
# =============================================================================

# Enter idle state after 30 seconds.
#
# The OLED turns off, but Bluetooth remains connected.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep.
CONFIG_ZMK_SLEEP=y

# Enter deep sleep after 15 minutes.
#
# Bluetooth disconnects during deep sleep and may take a few seconds
# to reconnect after the keyboard wakes.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# =============================================================================
# ZMK STUDIO
# =============================================================================

# Allow access to ZMK Studio without an unlock key.
CONFIG_ZMK_STUDIO_LOCKING=n


# =============================================================================
# OPTIONAL BLUETOOTH TROUBLESHOOTING
# =============================================================================

# Enable only if Bluetooth becomes unstable.
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable only if additional Bluetooth range is required.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Windows battery-notification workaround.
# Enable only if Windows fails to update the reported battery level.
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION

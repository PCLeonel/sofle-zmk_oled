# =============================================================================
# OLED
# =============================================================================

# Enable the OLED displays.
CONFIG_ZMK_DISPLAY=y

# Turn off the OLED when the keyboard enters idle state.
# This reduces battery consumption and avoids keeping a static image displayed.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Show battery charge as a percentage instead of only an icon.
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Show typing speed in words per minute on the OLED.
# If the OLED layout becomes crowded or the build has display problems,
# comment this line first.
CONFIG_ZMK_WIDGET_WPM_STATUS=y


# =============================================================================
# ROTARY ENCODERS
# =============================================================================

# Enable support for EC11 rotary encoders.
CONFIG_EC11=y

# Process encoder events using Zephyr's global work queue.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# =============================================================================
# IDLE AND DEEP SLEEP
# =============================================================================

# Enter the idle state after 30 seconds without keyboard activity.
#
# In idle state:
#   - the OLED is turned off;
#   - Bluetooth remains connected;
#   - pressing a key should wake the display immediately.
#
# Value is in milliseconds:
#   30000 ms = 30 seconds.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep to improve battery life.
#
# In deep sleep:
#   - Bluetooth is disconnected;
#   - OLED and peripherals are disabled;
#   - waking and reconnecting may take a few seconds.
CONFIG_ZMK_SLEEP=y

# Enter deep sleep after 15 minutes without keyboard activity.
#
# Value is in milliseconds:
#   900000 ms = 900 seconds = 15 minutes.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# =============================================================================
# ZMK STUDIO
# =============================================================================

# Allow ZMK Studio access without requiring a dedicated unlock key.
#
# ZMK Studio must also be enabled for the left side in build.yaml.
CONFIG_ZMK_STUDIO_LOCKING=n


# =============================================================================
# OPTIONAL BLUETOOTH SETTINGS
# =============================================================================

# Keep the following options disabled unless there is an actual Bluetooth
# connectivity problem.

# Enables experimental Bluetooth connection adjustments.
# Test this first if you experience frequent reconnections or instability.
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Increases Bluetooth transmission power to +8 dBm.
# This can help with range but may increase battery consumption.
# Only enable it if the normal Bluetooth range is insufficient.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Workaround for some Windows battery-notification problems.
# Do not enable unless the battery level fails to update correctly.
# CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# =============================================================================
# CUSTOM OLED SCREEN
# =============================================================================

CONFIG_ZMK_DISPLAY=y
CONFIG_LEONEL_SOFLE_OLED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y


# =============================================================================
# DISABLE STOCK WIDGETS
# =============================================================================

CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n


# =============================================================================
# ENABLE WPM CALCULATION
# =============================================================================

CONFIG_ZMK_WPM=y


# =============================================================================
# ENCODERS
# =============================================================================

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# =============================================================================
# POWER
# =============================================================================

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000


# =============================================================================
# ZMK STUDIO
# =============================================================================

CONFIG_ZMK_STUDIO_LOCKING=n

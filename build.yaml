# Firmware build matrix for Leonel's wireless Sofle.

---
include:
  # ===========================================================================
  # SOFLE LEFT
  # ===========================================================================
  #
  # Central side:
  #   - executes the keymap;
  #   - calculates WPM;
  #   - manages host Bluetooth profiles;
  #   - communicates with ZMK Studio over USB.

  - board: nice_nano@2//zmk
    shield: sofle_left
    artifact-name: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_WPM=y


  # ===========================================================================
  # SOFLE RIGHT
  # ===========================================================================
  #
  # Peripheral side:
  #   - reads its keyboard matrix;
  #   - reads its encoder;
  #   - sends events to the left side;
  #   - does not calculate WPM.

  - board: nice_nano@2//zmk
    shield: sofle_right
    artifact-name: sofle_right


  # ===========================================================================
  # NICE!NANO SETTINGS RESET
  # ===========================================================================

  - board: nice_nano@2//zmk
    shield: settings_reset
    artifact-name: nice_nano_v2_settings_reset
